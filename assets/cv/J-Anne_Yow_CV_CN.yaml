cv:
  name: 饶洁恩
  location: 新加坡
  email: janne.yow@gmail.com
  # phone: tel:+90-541-999-99-99
  website: https://janneyow.github.io/
  social_networks:
    - network: LinkedIn
      username: janneyow

  sections:
    个人简介:
      # - 南洋理工大学博士生，专注于开发能够从用户交互中学习与响应的自适应机器人系统。擅长将强化学习、控制策略与大模型集成到端到端机器人系统中。热衷于设计通用化、以用户为中心的机器人，并致力于进一步应用大模型于策略学习，打造更加智能与可扩展的机器人系统。
      - 新加坡南洋理工大学博士在读(2026年2月毕业），专注于构建可与人交互并持续自适应的机器人系统。擅长将强化学习、控制策略与基础模型整合进端到端机器人系统。热衷设计可泛化、以用户为中心且可规模化落地的机器人。目前主导建设具身智能数据工厂，通过高保真、低认知负荷的遥操作接口，持续采集大规模高质量数据，用于训练视觉-语言-动作（VLA）基础模型策略。

      # - 主要研究方向为具身智能与机器人学习系统。专注于结合强化学习、多模态感知与大语言模型技术，构建可自主学习、适应环境且能与人类高效协同的机器人系统。具备扎实的算法研发与系统实现能力，致力于推动以用户为中心、可泛化、可扩展的新一代机器人智能技术落地于真实场景。
      # - Final-year PhD researcher in Robotics at NTU Singapore focused on building adaptive robotic systems that learn from and respond to user interaction. Experienced in integrating reinforcement learning, control strategies, and foundation models into end-to-end robotic systems. Passionate about designing generalizable, user-informed robots, and eager to further apply foundation models in policy learning to build more adaptive and scalable robotic systems.

    教育背景:
      - institution: '[南洋理工大学](https://www.ntu.edu.sg/)'
        degree: 博士 
        area: 机械工程
        date: 2021.09 -- 2026.02 (预计)
        # start_date: 2021-09
        # end_date: present
        location: 新加坡
        summary: 
        highlights:
          - '**导师:** 洪伟德教授 （Prof Ang Wei Tech）'
          - '**论文题目:** Towards Personalized Robot Assistance: Integrating User Preferences in Robot-Assisted Feeding (人机协同下的个性化助餐：基于用户偏好的机器人赋能)'
          # - '**论文题目:** 人机协同下的个性化助餐：基于用户偏好的机器人赋能'
          - '**研究兴趣:** : 机器人学习（强化学习、模仿学习）、人机交互、大模型'

      - institution: '[南洋理工大学](https://www.ntu.edu.sg/)'
        degree: 本科 
        area: 机械工程与商业分析 (双专业)
        start_date: 2017-08
        end_date: 2021-05
        location: 新加坡
        summary: 
        highlights:
          - "**GPA:** 4.92/5.00, 一等荣誉学位"

    项目经历:
      - name: '具身智能数据工厂（高效机器人数据采集与学习平台）'
        date: 2025 -- 至今
        highlights:
          - 共同主导高保真遥操作系统的整体架构设计，实现双臂与灵巧手的连续零停顿动作映射，显著降低操作员认知负荷，保持人类运动与机器人执行的高度一致性。
          - 打造异构机器人共享的数据工厂，融合无标记三维动作捕捉、多模态传感同步与实时动作重定向，支持仿真与真实平台间的高效切换。
          - 探索面向下一代策略训练的数据管线，目标构建大规模高保真多模态数据集，为视觉-语言-动作（VLA）模型与扩散策略（diffusion policies）等提供高质量训练数据，提升策略的泛化性与稳健性。

          # - 共同主导高保真遥操作框架，双臂与灵巧手的连续零停顿动作映射，显著降低操作员认知负荷并保持人类运动一致性。
          # - 主导开发新一代全身、双臂及灵巧手遥控作框架，通过优化人机接口，显著降低操作员的认知负荷，实现机器人与人类指令在时空维度上的高保真同步。
          # - 面向人形机器人，构建可扩展的端到端数据采集标准流程：集成无标记动作捕捉、多模态传感器融合与实时运动重定向，打通实机与仿真的数据链路。
          # - 优化实时重定向算法，缩小人类示教与机器人执行之间的域差异，实现高吞吐、富标注的数据生产，为视觉-语言-动作（VLA）策略的大规模训练提供高质量数据支撑。
          # - '主导构建了可扩展的机器人数据采集管道，集成动作捕捉、多模态感知与实时动作重定向技术，覆盖灵巧手、机械臂及人形机器人平台。'
          # - '改进双臂与灵巧手遥操作系统，通过降低操作者认知负担并保留人类动作高保真度，显著缩小人机动作差距，为机器人学习提供高效数据基础。'
      
      - name: '机械辅助喂食系统'
        date: 2022 -- 至今
        highlights:
          - 主导端到端自适应喂食系统的技术开发，将多模态感知、运动规划与柔顺控制集成于安全、可部署的平台中，并成功应用于老年用户的试验。
          - '在MuJoCo中开发融合视觉与力矩反馈的强化学习策略，实现跨食物属性的自适应操作，完成 sim-to-real 迁移。'
          - 搭建了语言驱动的自适应管道，利用大语言模型（LLM）解析用户自然语言反馈，并将其映射为安全、可靠的机器人运动参数，以实现个性化行为调整。
          # - '主导开发并交付端到端的自适应喂食系统，将多模态感知、规划与控制集成到安全、可部署的平台中，并成功应用于老年用户的真实试验。'
          # - 在MuJoCo中开发了以目标为条件的强化学习策略，融合视觉与力矩反馈，实现对不同物理属性食物的自适应操作，并成功完成从仿真到实物的迁移。
          # - '构建语言驱动管道，利用大语言模型（LLM）将用户反馈映射为安全、可靠的机器人运动规划参数。'

      - name: '杂乱环境下的机器人抓取'
        date: 2020 -- 2023
        highlights:
          - '开发了点选式人机交互界面，将物体分割、抓取评分与抓取循环集成在一起，在杂乱场景中简化用户输入并提升选择效率。'
          - '提出基于 POMDP 的人机协同控制框架，可在意图不确定时主动向用户提问，从而减少冲突操作并加快任务完成。'

    工作与实习经历:
      - company: 南洋理工大学
        position: 助理研究员
        location: 新加坡
        date: 2021-08 -- 至今
        # start_date: 2021-08
        # end_date: present
        highlights:
          - 主导基于ROS/ROS2的系统集成与软硬件接口开发，与研究团队成员及学生协作制定技术目标，并在仿真环境与物理机器人系统上进行原型验证。
          - 负责项目规划、资源协调与伦理合规管理，消除算力瓶颈等运营障碍，确保项目按计划推进。
          - 指导了8个本科生毕业设计项目，设定研究目标，提供技术实现与方法技能发展的引导。
          - 撰写并参与具有竞争力的基金申请，为在研课题与新合作计划争取资金支持。

      - company: '[字节跳动](https://www.bytedance.com/en/)'
        position: SaaS销售运营实习生
        location: 新加坡
        start_date: 2020-05
        end_date: 2020-07
        highlights:
          - 设计并优化飞书（Lark）亚太区运营仪表板，实现关键指标可视化，支持区域团队数据驱动决策。
          - 改善Salesforce数据架构，优化业务流程，提升区域业务数据一致性与运营效率。
          - 分析用户行为数据（DAU／租户健康评分），以协助制定产品推广策略并评估市场适应性

      - company: '[Oishii](https://oishii.com/)'
        position: 工程实习生
        location: 新泽西州，美国
        start_date: 2020-01
        end_date: 2020-03
        highlights:
          - 领导农场基础设施扩展项目的规划与推进，在技术可行性、成本控制与生产连续性间实现有效平衡。
          - 主导农场自动化的传感器-执行器系统实施，工作涵盖方案设计、部署、电气布线、系统集成与布局规划。
          - 协同外部承包商与内部运营团队，识别并解决基础设施瓶颈，优化产线运作效率。

