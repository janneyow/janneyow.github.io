cv:
  name: 饶洁恩
  location: 新加坡
  email: janne.yow@gmail.com
  # phone: tel:+90-541-999-99-99
  website: https://janneyow.github.io/
  social_networks:
    - network: LinkedIn
      username: janneyow

  sections:
    简介:
      - 南洋理工大学（NTU）博士生，在洪伟德教授（Prof. Ang Wei Tech）指导下，专注于开发能够从用户交互中学习与响应的自适应机器人系统。擅长将强化学习、控制策略与大模型集成到端到端机器人系统中。热衷于设计通用化、以用户为中心的机器人，并致力于进一步应用大模型于策略学习，打造更加智能与可扩展的机器人系统。
      # - Final-year PhD researcher in Robotics at NTU Singapore focused on building adaptive robotic systems that learn from and respond to user interaction. Experienced in integrating reinforcement learning, control strategies, and foundation models into end-to-end robotic systems. Passionate about designing generalizable, user-informed robots, and eager to further apply foundation models in policy learning to build more adaptive and scalable robotic systems.

    教育背景:
      - institution: '[南洋理工大学](https://www.ntu.edu.sg/)'
        degree: 博士 
        area: 机械工程
        date: 2021.09 -- 2025.08 (预计)
        # start_date: 2021-09
        # end_date: present
        location: 新加坡
        summary: 
        highlights:
          - '**导师:** 洪伟德教授 （Prof Ang Wei Tech）'
          - '**论文题目:** 增强辅助喂食机器人的人机交互与个性化行为'
          - '**研究兴趣:** 人机交互、机器人学习、强化学习、大模型'

      - institution: '[南洋理工大学](https://www.ntu.edu.sg/)'
        degree: 本科 
        area: 机械工程与商业双专业
        start_date: 2017-08
        end_date: 2021-05
        location: 新加坡
        summary: 
        highlights:
          - "**GPA:** 4.92/5.00, 连续四年入选院长名单 (Dean's List)"
          - '**荣誉奖项:** [Dr Leung Shiu Kee Gold Medal Award](https://www.ntu.edu.sg/mae/admissions/current-students/undergraduate/medals-and-prizes), 东盟本科奖学金'
    
    项目经历:
      - name: '机械辅助喂食'
        date: 2022 -- 至今
        highlights:
          - '主导开发了一个端到端的机器人辅助喂食系统，包括咬合序列、适应性食物获取和安全咬合转移。'
          - '设计了一个个性化的喂食管道，通过语言纠正来适应用户偏好，利用基础模型来解释和响应用户反馈。'
          - '开发了一个目标条件的舀取策略，使用强化学习来获取不同食物属性下的目标咬合大小。'
          - '为系统的实际部署和与老年用户的用户试验做准备，以更好地理解用户偏好并优化机器人行为，以实现安全、有效的辅助喂食。'

      - name: '杂乱环境下的抓取'
        date: 2020 -- 2023
        highlights:
          - '开发了一个点选式界面，用于在杂乱环境中进行监督的抓取和放置，集成了物体分割和抓取循环，以改善抓取选择。'
          - '开发了一个基于POMDP的共享自主框架，在意图不确定性下查询用户，改善目标消歧，增强人机协作的有效性。'

    工作经历:
      - company: 南洋理工大学
        position: 研究助理
        location: 新加坡
        date: 2021-08 -- 至今
        # start_date: 2021-08
        # end_date: present
        highlights:
          - 主导开发了一个个性化的机器人辅助喂食系统，集成了感知、控制和基于语言的用户交互，以实现自适应辅助。
          - 管理项目规划、资源协调以及系统开发和用户试验的伦理和安全合规性。
          - 参与资金申请，并帮助启动与海外机构的研究合作。
          - 负责本科生毕业设计项目的范围界定和指导，提供研究方向、方法论和技术实施方面的建议。

      - company: '[字节跳动](https://www.bytedance.com/en/)'
        position: SaaS销售运营实习生
        location: 新加坡
        start_date: 2020-05
        end_date: 2020-07
        highlights:
          - 设计和优化仪表板，以支持飞书(Lark)亚太团队的运营洞察和数据驱动决策。
          - 改善Salesforce数据质量，简化工作流程，提高区域业务单位的一致性。
          - 分析用户行为趋势（例如，日活跃用户（DAU）、租户健康评分），以支持市场推广策略并评估产品市场契合度。

      - company: '[Oishii](https://oishii.com/)'
        position: 工程实习生
        location: 新泽西州，美国
        start_date: 2020-01
        end_date: 2020-03
        highlights:
          - 负责一个基础设施扩展项目的规划与管理，在技术需求与运营限制之间进行平衡。
          - 规划和实施传感器与执行器系统，以支持农场操作的自动化，包括布线、集成和布局决策。
          - 与跨职能承包商合作，解决基础设施限制，改善农场操作。

    学术成果:
